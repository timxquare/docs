# Icemail remote MCP server — deploys to Cloudflare Workers, served at mcp.icemail.ai
name = "icemail-mcp"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# Default API base — used for `wrangler dev` (localhost) and as a fallback.
# Per-tenant API base URLs live in src/tenants.ts, keyed by hostname.
[vars]
ICEMAIL_API_BASE = "https://api.icemail.ai"

# McpAgent stores each MCP session in a Durable Object. The binding name MUST be
# MCP_OBJECT — that is the name the `agents` SDK looks up.
[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "IcemailMCP"

# SQLite-backed Durable Objects are required by McpAgent.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["IcemailMCP"]

# One custom-domain route per whitelabel tenant. Each hostname must also have a
# matching entry in src/tenants.ts. The tenant's zone must be active on this
# Cloudflare account — Wrangler creates the DNS record + TLS cert on first deploy.
#
# Onboard a new whitelabel customer = add a route here + an entry in tenants.ts,
# then `npm run deploy`.
[[routes]]
pattern = "mcp.icemail.ai"
custom_domain = true

# [[routes]]
# pattern = "mcp.acmemail.com"
# custom_domain = true

# [[routes]]
# pattern = "mcp.coldreach.io"
# custom_domain = true

[observability]
enabled = true
